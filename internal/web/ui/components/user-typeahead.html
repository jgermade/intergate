<script :setup="{ model = '', search = null, name = 'email', placeholder = 'name@example.com', label = 'Email' }">
  // An email field that suggests accounts as you type, from `search` (an
  // async function of the text that returns `{email, name, avatar_url}`s).
  // Any email can still be typed. The text goes back up through `:model`;
  // picking a suggestion (click, or arrows and Enter) also emits `pick`
  // with its email. A combobox: the field keeps the focus, the list says
  // which one is active.
  //
  //   <UserTypeahead :model="email" :search="q => api('GET', '/…?q=' + q)" @pick="add($event.detail)" />
  const listId = "typeahead-" + Math.random().toString(36).slice(2, 10)

  let items = []
  let open = false
  // The suggestion the arrows are on, or -1.
  let active = -1
  // Answers can arrive out of order: only the latest asked is shown.
  let asked = 0
  let timer = 0

  const close = () => {
    open = false
    active = -1
  }

  const suggest = text => {
    clearTimeout(timer)
    const q = text.trim()
    if (!q || !search) {
      items = []
      close()
      return
    }
    const n = ++asked
    timer = setTimeout(async () => {
      try {
        const found = await search(q)
        if (n !== asked) return
        items = found || []
        open = items.length > 0
        active = -1
      } catch {
        if (n === asked) close()
      }
    }, 150)
  }

  const type = text => {
    $updateModel(text)
    suggest(text)
  }

  const pick = item => {
    clearTimeout(timer)
    asked++
    items = []
    close()
    $updateModel(item.email)
    $emit("pick", item.email)
  }

  const keydown = e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!items.length) return
      e.preventDefault()
      open = true
      const step = e.key === "ArrowDown" ? 1 : -1
      active = (active + step + items.length + 1) % (items.length + 1)
      if (active === items.length) active = -1
    } else if (e.key === "Enter" && open && active >= 0) {
      e.preventDefault()
      pick(items[active])
    } else if (e.key === "Escape" && open) {
      e.preventDefault()
      close()
    }
  }

  $: activeId = open && active >= 0 ? listId + "-" + active : null
</script>

<div class="typeahead">
  <input type="email" :name="name" required maxlength="254" autocomplete="off" spellcheck="false" autocapitalize="off"
         role="combobox" aria-autocomplete="list" :aria-expanded="open ? 'true' : 'false'" :aria-controls="listId"
         :aria-activedescendant="activeId" :aria-label="label" :placeholder="placeholder" :value="model"
         @input="type($event.target.value)" @keydown="keydown($event)" @blur="close()"
         @focus="items.length && model.trim() && (open = true)">
  <ul class="typeahead-list" role="listbox" :id="listId" :aria-label="label + ' suggestions'" :hidden="open ? null : true">
    <li :each="item in items" :key="item.email" :id="listId + '-' + $index" role="option"
        :aria-selected="$index === active ? 'true' : 'false'" :class.active="$index === active"
        @mousedown.prevent="pick(item)" @mousemove="active = $index">
      <img :if="item.avatar_url" class="avatar" :src="item.avatar_url" alt="">
      <span :else class="avatar" aria-hidden="true">{{ (item.name || item.email)[0] }}</span>
      <span class="typeahead-text">
        <span class="typeahead-name">{{ item.name || item.email }}</span>
        <span :if="item.name" class="typeahead-email">{{ item.email }}</span>
      </span>
    </li>
  </ul>
</div>
