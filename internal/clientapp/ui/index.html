<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>intergate</title>
<!-- The dashboard's look: its theme and stylesheet, from internal/web/ui,
     then what is the window's own. -->
<link rel="stylesheet" href="/ui/theme/default/tokens.css">
<link rel="stylesheet" href="/ui/app.css">
<link rel="stylesheet" href="/app/app.css">
<link rel="icon" href="/ui/favicon.svg" type="image/svg+xml">
<script type="application/json" id="boot">{"token": {{.Token}}}</script>
</head>
<body>
<div id="app"></div>
<script type="importmap" nonce="{{.Nonce}}">{ "imports": { "@ui/": "/ui/", "@theme/": "/ui/theme/default/" } }</script>
<script type="module" nonce="{{.Nonce}}">
  import { C79 } from "@ui/vendor/jq79.js"
  await C79.safeEval({ nonce: true })
  C79.fetch("/app/app.html").mount("#app")
</script>
</body>
</html>
